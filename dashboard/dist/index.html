<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plugin Desk · 통합 대시보드</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<header><a class="brand" href="/">▦ <span>Plugin Desk</span><small>WORK CONTROL</small></a><span class="local">LOCAL / 조회 전용</span><button id="pause" aria-pressed="false">자동 갱신 켜짐</button><button id="refresh">새로고침 ↻</button></header>
<main><div class="heading"><div><p class="eyebrow">WORKSPACE / D:\Dev</p><h1 id="title">함께 사용</h1><p id="subtitle">근거 수집부터 문서화와 검증까지, 연결 상태와 결과를 확인합니다.</p></div><span id="updated" aria-live="polite">연결 중…</span></div>
<nav aria-label="대시보드 모드"><button data-mode="all" aria-pressed="true">함께 사용</button><button data-mode="greplet" aria-pressed="false">Greplet</button><button data-mode="spec" aria-pressed="false">Legacy Spec</button><button data-mode="tierwork" aria-pressed="false">Tierwork</button></nav>
<section class="runner-panel" aria-label="새 활동마다 점프하는 공룡"><div class="runner-head"><div><strong>EVENT RUNNER</strong><span id="runner-note" role="status">새 활동을 기다리는 중</span></div><div><span id="runner-score" aria-label="점프 횟수">0000</span><button id="runner-reset" aria-label="점프 횟수 초기화">초기화</button><button id="runner-demo">점프 미리보기</button></div></div><canvas id="runner" width="1200" height="160" aria-label="새 활동이 도착하면 공룡이 장애물을 뛰어넘습니다"></canvas><p class="runner-caption">새로 감지한 기록 1개 = 점프 1회 · 여러 개는 차례대로 · 최초 기록은 제외</p></section>
<p id="error" role="alert" hidden></p><div id="content"><div class="panel">실제 데이터를 읽고 있습니다…</div></div>
<section id="reader" class="panel" hidden><div class="section-head"><h2 id="doc-title"></h2><button id="close">닫기</button></div><pre id="doc-body"></pre></section>
<footer>5초마다 자동 갱신 · 로컬 파일과 API에서 수집한 기록 · 실행 상태는 원본 기록 기준</footer></main></body></html>
